      const container = document.getElementById('slide-container');
      container.innerHTML = slidesContent[currentSlide];
      document.getElementById('slide-indicator').textContent = `Slide ${currentSlide} / ${totalSlides}`;

      for (let i = 1; i <= totalSlides; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (i === currentSlide) {
          tab.className = 'tab-btn p-2 rounded-lg text-center text-xs font-medium border bg-sky-600/30 border-sky-500 text-white shadow';
        } else {
          tab.className = 'tab-btn p-2 rounded-lg text-center text-xs font-medium border bg-slate-900 border-slate-800 text-slate-400 hover:bg-slate-800';
        }
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        currentSlide--;
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        currentSlide++;
        renderSlide();
      }
    }

    function goToSlide(n) {
      currentSlide = n;
      renderSlide();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight') nextSlide();
    });

    renderSlide();
  </script>
</body>
</html>
